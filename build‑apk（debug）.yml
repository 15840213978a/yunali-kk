name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      # ========= 安装Python3.10（适配Chaquopy） =========
      - name: Install Python3.10 for Chaquopy buildPython
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-venv
          # 软链接，让chaquopy识别python3.10
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          python3 --version
      # 缓存chaquopy下载的python包，加速后续构建
      - name: Cache Chaquopy python
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/chaquopy/downloads/python
          key: chaquopy-python-3.10.14
      # Pre-download Android端Python包（手机运行用的arm64包）
      - name: Pre-download Chaquopy Python3.10 Android
        run: |
          mkdir -p ~/.gradle/caches/chaquopy/downloads/python
          cd ~/.gradle/caches/chaquopy/downloads/python
          PY_ZIP="python-3.10.14-android-arm64-v8a.zip"
          curl -L --connect-timeout 120 --retry 3 "https://chaquo.com/python/${PY_ZIP}" -o ${PY_ZIP}
          ls -lh .
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 列出apk目录，方便排查
      - name: List APK files
        run: ls -R app/build/outputs/apk/

      # 使用通配符上传所有编译出来的APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/*.apk
