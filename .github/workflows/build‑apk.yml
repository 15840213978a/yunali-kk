name: Build AVBox Mobile + TV Release (Secrets)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要编译的分支/Tag（手机版 + TV 共用源码）'
        required: true
        default: 'tv-ui'
      version:
        description: 'Release version / tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: '标记为 Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.source_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Set up Python 3.10 (Chaquopy build Python)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install required SDK/NDK & verify
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }

          sdkmanager() { "$SDKMANAGER" "$@"; }

          echo "== 仓库里可用的 API 37 平台 / NDK 27 =="
          ALL="$(sdkmanager --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "PLATFORM=$PLATFORM  NDK=$NDK  BUILD_TOOLS=$BUILD_TOOLS"
          [ -n "$PLATFORM" ] || { echo "::error::仓库里找不到 android-37 平台"; exit 1; }
          [ -n "$NDK" ] || { echo "::error::仓库里找不到 ndk;27.2.12479018"; exit 1; }

          # --licenses 在无待接受许可时会因管道 broken pipe 返回非 0,故忽略其结果
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          ARGS=("$PLATFORM" "$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          sdkmanager "${ARGS[@]}"

          test -d "$SDK_ROOT/platforms/${PLATFORM#platforms;}" \
            || { echo "::error::$PLATFORM 未安装"; exit 1; }
          test -d "$SDK_ROOT/ndk/${NDK#ndk;}" || { echo "::error::$NDK 未安装"; exit 1; }
          python3 -c "import sys; print('build python:', sys.version)"

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Prepare signing from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.WEBHTV_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WEBHTV_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WEBHTV_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WEBHTV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::GitHub Secret 对应的 $v 为空"
              exit 1
            fi
          done

          STORE_PATH="$GITHUB_WORKSPACE/.key/app-release.jks"
          mkdir -p "$(dirname "$STORE_PATH")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$STORE_PATH"
          test -s "$STORE_PATH" || { echo "::error::keystore 解码失败或为空"; exit 1; }

          # 删除旧的同名签名项，避免重复配置
          if [ -f gradle.properties ]; then
            sed -i               -e '/^RELEASE_STORE_FILE=/d'               -e '/^RELEASE_KEY_ALIAS=/d'               -e '/^RELEASE_STORE_PASSWORD=/d'               -e '/^RELEASE_KEY_PASSWORD=/d'               gradle.properties
          else
            touch gradle.properties
          fi

          {
            echo "RELEASE_STORE_FILE=.key/app-release.jks"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties

          keytool -list             -keystore "$STORE_PATH"             -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS"             >/dev/null

          echo "Signing material OK"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename & verify APK
        id: apk
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/AVBox_release.apk
          test -f "$SRC" || { echo "::error::未找到 $SRC"; exit 1; }

          VERSION='${{ github.event.inputs.version }}'
          OUT="AVBox-Mobile-TV_${VERSION}.apk"
          cp "$SRC" "$OUT"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -r | head -n1)"
          echo "apksigner: $APKSIGNER"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT" || { echo "::error::APK 签名校验失败"; exit 1; }
          fi
          echo "size: $(du -h "$OUT" | cut -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVBox-Mobile-TV-${{ github.event.inputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: AVBox Mobile + TV ${{ github.event.inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
