name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ========= 安装Python3.10（适配Chaquopy） =========
      - name: Install Python3.10 for Chaquopy buildPython
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-venv
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          python3 --version

      - name: Cache Chaquopy python
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/chaquopy/downloads/python
          key: chaquopy-python-3.10.14

      - name: Pre-download Chaquopy Python3.10 Android
        run: |
          mkdir -p ~/.gradle/caches/chaquopy/downloads/python
          cd ~/.gradle/caches/chaquopy/downloads/python
          PY_ZIP="python-3.10.14-android-arm64-v8a.zip"
          curl -L --connect-timeout 120 --retry 3 "https://chaquo.com/python/${PY_ZIP}" -o ${PY_ZIP}
          ls -lh .

      # ===================== 还原keystore文件 =====================
      - name: Restore keystore from Base64 secret
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
        run: |
          pwd
          ls -la
          mkdir -p app
          echo -n "$SIGNING_KEY" | tr -d '\n' | base64 -d > ${SIGNING_STORE_FILE}
          ls -l ${SIGNING_STORE_FILE}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===================== 单行gradle命令，密码加双引号修复特殊字符 =====================
      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        run: ./gradlew assembleRelease -PstoreFile=${{ secrets.SIGNING_STORE_FILE }} -PkeyAlias=${{ secrets.SIGNING_KEY_ALIAS }} -PstorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" -PkeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}" --stacktrace --no-daemon

      - name: List APK files
        run: ls -R app/build/outputs/apk/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/*.apk
