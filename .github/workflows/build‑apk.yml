name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ========= 安装Python3.10（适配Chaquopy） =========
      - name: Install Python3.10 for Chaquopy buildPython
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-venv
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          python3 --version

      - name: Cache Chaquopy python
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/chaquopy/downloads/python
          key: chaquopy-python-3.10.14

      - name: Pre-download Chaquopy Python3.10 Android
        run: |
          mkdir -p ~/.gradle/caches/chaquopy/downloads/python
          cd ~/.gradle/caches/chaquopy/downloads/python
          PY_ZIP="python-3.10.14-android-arm64-v8a.zip"
          curl -L --connect-timeout 120 --retry 3 "https://chaquo.com/python/${PY_ZIP}" -o ${PY_ZIP}
          ls -lh .

      # ===================== 还原签名文件 =====================
      # 路径固定，不再依赖 SIGNING_STORE_FILE Secret，避免 STORE_PATH 为空
      - name: Restore keystore from base64
        env:
          B64KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          STORE_PATH="$GITHUB_WORKSPACE/.key/release.jks"
          echo "Target keystore path: $STORE_PATH"

          if [ -z "${B64KEY:-}" ]; then
            echo "::error::缺少 GitHub Secret: SIGNING_KEY"
            exit 1
          fi

          mkdir -p "$(dirname "$STORE_PATH")"
          printf '%s' "$B64KEY" | base64 --decode > "$STORE_PATH"

          if [ ! -s "$STORE_PATH" ]; then
            echo "::error::签名文件解码失败或为空"
            exit 1
          fi

          ls -lh "$STORE_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===================== 四版本打包：手机/电视 × 8A/7A =====================
      - name: Verify four variant tasks
        run: |
          set -euo pipefail
          ./gradlew :app:tasks --all > app-tasks.txt

          REQUIRED_TASKS=(
            assembleMobileArm64_v8aRelease
            assembleMobileArmeabi_v7aRelease
            assembleLeanbackArm64_v8aRelease
            assembleLeanbackArmeabi_v7aRelease
          )

          for task in "${REQUIRED_TASKS[@]}"; do
            if ! grep -q "$task" app-tasks.txt; then
              echo "::error::源码缺少 Gradle 任务 :app:$task"
              echo "::error::需要 app/build.gradle(.kts) 定义 mobile/leanback 与 arm64_v8a/armeabi_v7a 四个 flavor。"
              exit 1
            fi
          done

      - name: Build four Release APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          STORE_FILE="$GITHUB_WORKSPACE/.key/release.jks"

          for v in KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::签名变量 $v 为空"
              exit 1
            fi
          done

          keytool -list \
            -keystore "$STORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            -PstoreFile="${STORE_FILE}" \
            -PkeyAlias="${KEY_ALIAS}" \
            -PstorePassword="${STORE_PASSWORD}" \
            -PkeyPassword="${KEY_PASSWORD}" \
            --stacktrace --no-daemon

      - name: Collect and rename four APKs
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          find app/build/outputs/apk -type f -name "*.apk" -print

          MOBILE_8A="$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'mobile.*arm64|arm64.*mobile' | head -n1 || true)"
          MOBILE_7A="$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei 'mobile.*armeabi|armeabi.*mobile|mobile.*v7a|v7a.*mobile' | head -n1 || true)"
          TV_8A="$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei '(leanback|tv).*arm64|arm64.*(leanback|tv)' | head -n1 || true)"
          TV_7A="$(find app/build/outputs/apk -type f -name "*.apk" | grep -Ei '(leanback|tv).*(armeabi|v7a)|(armeabi|v7a).*(leanback|tv)' | head -n1 || true)"

          [ -n "$MOBILE_8A" ] || { echo "::error::未找到手机 arm64-v8a APK"; exit 1; }
          [ -n "$MOBILE_7A" ] || { echo "::error::未找到手机 armeabi-v7a APK"; exit 1; }
          [ -n "$TV_8A" ] || { echo "::error::未找到电视 arm64-v8a APK"; exit 1; }
          [ -n "$TV_7A" ] || { echo "::error::未找到电视 armeabi-v7a APK"; exit 1; }

          cp "$MOBILE_8A" dist/手机版-arm64-v8a.apk
          cp "$MOBILE_7A" dist/手机版-armeabi-v7a.apk
          cp "$TV_8A" dist/电视版-arm64-v8a.apk
          cp "$TV_7A" dist/电视版-armeabi-v7a.apk

          echo "== Release APKs =="
          ls -lh dist/

      - name: Upload four APKs to Actions
        uses: actions/upload-artifact@v4
        with:
          name: 四版本-APK
          path: dist/*.apk
          if-no-files-found: error

      # ===================== 发布到 GitHub Releases 的“资源”位置 =====================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: 自动构建的 Release APK
          body: |
            自动构建的四版本 APK

            Commit: ${{ github.sha }}

            - 手机版 arm64-v8a
            - 手机版 armeabi-v7a
            - 电视版 arm64-v8a
            - 电视版 armeabi-v7a
          files: |
            dist/手机版-arm64-v8a.apk
            dist/手机版-armeabi-v7a.apk
            dist/电视版-arm64-v8a.apk
            dist/电视版-armeabi-v7a.apk
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
