name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      # ========= 安装Python3.10（适配Chaquopy） =========
      - name: Install Python3.10 for Chaquopy buildPython
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-venv
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
          python3 --version
      - name: Cache Chaquopy python
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/chaquopy/downloads/python
          key: chaquopy-python-3.10.14
      - name: Pre-download Chaquopy Python3.10 Android
        run: |
          mkdir -p ~/.gradle/caches/chaquopy/downloads/python
          cd ~/.gradle/caches/chaquopy/downloads/python
          PY_ZIP="python-3.10.14-android-arm64-v8a.zip"
          curl -L --connect-timeout 120 --retry 3 "https://chaquo.com/python/${PY_ZIP}" -o ${PY_ZIP}
          ls -lh .
      # ===================== 【修复根治版】还原keystore，用临时文件方式，避开超长env bug =====================
      - name: Restore keystore from Base64 secret
        run: |
          pwd
          ls -la
          mkdir -p app
          # 单引号EOF，原样写入base64，不做shell解析！
          cat > /tmp/key.b64 <<'EOF'
${{ secrets.SIGNING_KEY }}
EOF
          tr -d '\r\n' < /tmp/key.b64 | base64 -d > "${{ secrets.SIGNING_STORE_FILE }}"
          ls -l "${{ secrets.SIGNING_STORE_FILE }}"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # ===================== 把所有签名参数放到ENV，避免命令行直接展开secret =====================
      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
          STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease \
          -PstoreFile="$STORE_FILE" \
          -PkeyAlias="$KEY_ALIAS" \
          -PstorePassword="$STORE_PASSWORD" \
          -PkeyPassword="$KEY_PASSWORD" \
          --stacktrace --no-daemon
      - name: List APK files
        run: ls -R app/build/outputs/apk/
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/*.apk
